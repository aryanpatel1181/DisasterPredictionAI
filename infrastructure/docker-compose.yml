version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terraguard_db
    environment:
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: terraguard_dev_pass
      POSTGRES_DB: terraguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard -d terraguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: terraguard_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: terraguard_api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ..:/app

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    container_name: terraguard_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
