services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://terraguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/terraguard_db
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terraguard_db
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U terraguard -d terraguard_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  gateway:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes: ["./infrastructure/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  database:
